<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteTaker - Your Personal Note Manager</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
        :root {
            --blue: #2563eb;
            --blue-dark: #1d4ed8;
            --ink: #172b4d;
            --muted: #64748b;
            --line: #e2e8f0;
            --surface: #f8fafc;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #edf4ff 0, #f6f8fc 320px);
            min-height: 100vh;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font: inherit; }
        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 40px 28px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid #dbe5f3;
        }
        .header h1 {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 28px;
            font-weight: 750;
            letter-spacing: -1px;
        }
        .brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            color: white;
            background: var(--blue);
            box-shadow: 0 4px 12px #2563eb25;
        }
        .brand-mark svg { width: 23px; height: 23px; }
        .header p { margin: 10px 0 0 52px; font-size: 14px; color: var(--muted); }
        .main-content {
            display: grid;
            grid-template-columns: minmax(260px, 1fr) minmax(0, 2.2fr);
            gap: 24px;
            flex: 1;
            align-content: start;
            align-items: stretch;
        }
        .sidebar, .note-editor {
            min-width: 0;
            background: white;
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: 0 6px 24px #172b4d06;
        }
        .sidebar { padding: 20px; }
        .note-editor { padding: 28px; display: flex; flex-direction: column; }
        .sidebar-heading {
            margin-bottom: 18px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--muted);
            text-transform: uppercase;
        }
        .search-box {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: var(--surface);
            font-size: 14px;
            margin-bottom: 12px;
        }
        .new-note-btn {
            width: 100%;
            padding: 11px;
            background: var(--blue);
            color: white;
            border: 1px solid var(--blue);
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 22px;
        }
        .new-note-btn:hover { background: var(--blue-dark); }
        .notes-list { max-height: 500px; overflow-y: auto; overflow-x: hidden; }
        .note-item {
            padding: 14px;
            border: 1px solid transparent;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: border-color .15s, background .15s;
            background: white;
            overflow-wrap: anywhere;
        }
        .note-item:hover { background: var(--surface); border-color: var(--line); }
        .note-item.active { background: #eff6ff; border-color: #bfdbfe; box-shadow: inset 3px 0 0 var(--blue); }
        .note-title { font-weight: 650; font-size: 14px; margin-bottom: 6px; }
        .note-item.active .note-title { color: var(--blue-dark); }
        .note-preview {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.65;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .note-date { font-size: 11px; color: #718096; margin-top: 10px; }
        .editor-header {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            margin-bottom: 24px;
            gap: 18px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--line);
        }
        .editor-title { font-size: 24px; font-weight: 700; letter-spacing: -.6px; overflow-wrap: anywhere; }
        .editor-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .language-select {
            padding: 9px 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: white;
            color: var(--ink);
            font-size: 13px;
            min-height: 38px;
        }
        .btn {
            padding: 9px 16px;
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            min-height: 38px;
            transition: background .15s, border-color .15s;
        }
        .btn-save { background: var(--blue); color: white; }
        .btn-save:hover { background: var(--blue-dark); }
        .btn-translate { background: #eff6ff; color: var(--blue-dark); border-color: #dbeafe; }
        .btn-translate:hover { background: #dbeafe; }
        .btn-delete { background: white; color: #b42318; border-color: var(--line); margin-left: auto; }
        .btn-delete:hover { background: #fff1f2; border-color: #fecdd3; }
        button:disabled { opacity: .5; cursor: wait; }
        .form-group { margin-bottom: 20px; }
        #editorForm { flex: 1; flex-direction: column; min-height: 0; }
        #editorForm .content-group { display: flex; flex-direction: column; flex: 1; margin-bottom: 0; }
        .form-label { display: block; margin-bottom: 9px; font-size: 12px; font-weight: 650; color: var(--muted); }
        .form-input, .form-textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 9px;
            font-size: 15px;
            color: var(--ink);
            background: #fcfdff;
            transition: border-color .15s, box-shadow .15s;
        }
        .form-textarea { min-height: 150px; height: 150px; flex: 1; resize: vertical; line-height: 1.8; }
        input::placeholder, textarea::placeholder { color: #8492a6; }
        .search-box:focus, .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: #93b4fb;
            box-shadow: 0 0 0 3px #2563eb12;
            background: white;
        }
        button:focus-visible, select:focus-visible, .note-item:focus-visible { outline: 3px solid #93b4fb; outline-offset: 3px; }
        .empty-state { text-align: center; padding: 64px 20px; color: var(--muted); }
        .empty-state h3 { font-size: 22px; color: var(--ink); margin-bottom: 12px; letter-spacing: -.5px; }
        .empty-state p { font-size: 14px; line-height: 1.7; }
        .loading { padding: 12px; color: var(--muted); font-size: 13px; }
        .error, .success { padding: 12px 14px; border-radius: 8px; margin-bottom: 18px; font-size: 13px; line-height: 1.6; }
        .error { background: #fff1f2; color: #9f1239; border: 1px solid #fecdd3; }
        .success { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
        .notes-list::-webkit-scrollbar { width: 5px; }
        .notes-list::-webkit-scrollbar-track { background: transparent; }
        .notes-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 5px; }
        .notes-list::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @media (max-width: 768px) {
            .container { padding: 24px 16px; }
            .header { margin-bottom: 24px; }
            .header h1 { font-size: 25px; }
            .header p { margin-left: 0; }
            .main-content { grid-template-columns: 1fr; gap: 18px; }
            .sidebar, .note-editor { padding: 20px; }
            .notes-list { max-height: 280px; }
            .editor-title { font-size: 22px; }
            .btn-delete { margin-left: 0; }
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
        .image-section { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
        .image-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .image-heading .form-label { margin: 0; }
        .image-upload { font-size: 12px; font-weight: 600; color: var(--blue); }
        #imageUpload { display: block; width: 180px; max-width: 100%; font-size: 11px; margin-top: 6px; }
        .image-hint { color: var(--muted); font-size: 12px; margin: 12px 0; }
        .image-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
        .image-card { min-width: 0; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
        .image-card img { display: block; width: 100%; height: 120px; object-fit: cover; background: var(--surface); }
        .image-caption { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
        .image-caption span { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .image-caption button { color: #b42318; background: white; border: 1px solid var(--line); border-radius: 5px; padding: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l3 3v15H6z"/><path d="M14 3v5h4M9 12h6M9 16h4"/></svg></span>NoteTaker</h1>
            <p>Organize your thoughts, capture your ideas</p>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <h2 class="sidebar-heading">Your library</h2>
                <input type="text" class="search-box" id="searchBox" placeholder="Search notes..." aria-label="Search notes">
                <button class="new-note-btn" id="newNoteBtn">+ New Note</button>
                
                <div class="notes-list" id="notesList">
                    <div class="loading">Loading notes...</div>
                </div>
            </div>

            <div class="note-editor">
                <div class="editor-header">
                    <h2 class="editor-title" id="editorTitle">Select a note to edit</h2>
                    <div class="editor-actions" id="editorActions" style="display: none;">
                        <select class="language-select" id="targetLanguage" aria-label="Translation target language">
                            <option value="Simplified Chinese">简体中文</option>
                            <option value="Traditional Chinese">繁體中文</option>
                            <option value="English">English</option>
                            <option value="Japanese">日本語</option>
                            <option value="Korean">한국어</option>
                            <option value="French">Français</option>
                            <option value="Spanish">Español</option>
                            <option value="German">Deutsch</option>
                        </select>
                        <button class="btn btn-translate" id="translateBtn">Translate</button>
                        <button class="btn btn-save" id="saveBtn">Save</button>
                        <button class="btn btn-delete" id="deleteBtn" style="display: none;">Delete</button>
                    </div>
                </div>

                <div id="messageArea" role="status" aria-live="polite"></div>

                <div id="editorForm" style="display: none;">
                    <div class="form-group">
                        <label class="form-label" for="noteTitle">Title</label>
                        <input type="text" class="form-input" id="noteTitle" placeholder="Enter note title...">
                    </div>

                    <div class="form-group content-group">
                        <label class="form-label" for="noteContent">Content</label>
                        <textarea class="form-textarea" id="noteContent" placeholder="Start writing your note..."></textarea>
                    </div>
                    <section class="image-section" aria-label="Note images">
                        <div class="image-heading">
                            <span class="form-label">Images</span>
                            <label class="image-upload" for="imageUpload">Attach image
                                <input id="imageUpload" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/heic,image/heif,.heic,.heif">
                            </label>
                        </div>
                        <p class="image-hint" id="imageHint">Save this note before attaching images.</p>
                        <div class="image-gallery" id="imageGallery"></div>
                    </section>
                </div>

                <div class="empty-state" id="emptyState">
                    <h3>Welcome to NoteTaker!</h3>
                    <p>Select an existing note or create a new one to get started.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        class NoteTaker {
            constructor() {
                this.notes = [];
                this.currentNote = null;
                this.isLoading = false;
                this.isTranslating = false;
                this.isSaving = false;
                this.isDeleting = false;
                this.isAttachmentBusy = false;
                this.saveTimeout = null;
                this.init();
            }

            async init() {
                this.bindEvents();
                await this.loadNotes();
            }

            bindEvents() {
                document.getElementById('newNoteBtn').addEventListener('click', () => this.createNewNote());
                document.getElementById('saveBtn').addEventListener('click', () => this.saveNote());
                document.getElementById('deleteBtn').addEventListener('click', () => this.deleteNote());
                document.getElementById('translateBtn').addEventListener('click', () => this.translateNote());
                document.getElementById('imageUpload').addEventListener('change', () => this.uploadImage());
                document.getElementById('searchBox').addEventListener('input', (e) => this.searchNotes(e.target.value));
                
                // Auto-save on content change (debounced)
                const autoSave = () => {
                    clearTimeout(this.saveTimeout);
                    this.saveTimeout = setTimeout(() => {
                        if (this.currentNote && this.currentNote.id) {
                            this.saveNote(true);
                        }
                    }, 2000);
                };
                
                document.getElementById('noteTitle').addEventListener('input', autoSave);
                document.getElementById('noteContent').addEventListener('input', autoSave);
            }

            async loadNotes() {
                this.isLoading = true;
                this.showMessage('Loading notes...', 'loading');
                
                try {
                    const response = await fetch('/api/notes');
                    if (!response.ok) throw new Error('Failed to load notes');
                    
                    this.notes = await response.json();
                    this.renderNotesList();
                    this.hideMessage();
                } catch (error) {
                    this.showMessage(`Error loading notes: ${error.message}`, 'error');
                } finally {
                    this.isLoading = false;
                }
            }

            renderNotesList() {
                const notesList = document.getElementById('notesList');
                
                if (this.notes.length === 0) {
                    notesList.innerHTML = '<div class="empty-state"><p>No notes yet. Create your first note!</p></div>';
                    return;
                }

                notesList.innerHTML = this.notes.map(note => `
                    <div class="note-item ${this.currentNote && this.currentNote.id === note.id ? 'active' : ''}" 
                         data-note-id="${note.id}" onclick="noteTaker.selectNote(${note.id})">
                        <div class="note-title">${this.escapeHtml(note.title || 'Untitled')}</div>
                        <div class="note-preview">${this.escapeHtml(note.content || 'No content')}</div>
                        <div class="note-date">${this.formatDate(note.updated_at)}</div>
                    </div>
                `).join('');
            }

            async selectNote(noteId) {
                if (this.isTranslating || this.isAttachmentBusy) return;
                const note = this.notes.find(n => n.id === noteId);
                if (!note) return;

                this.currentNote = note;
                this.showEditor();
                this.renderNotesList(); // Re-render to update active state
                
                document.getElementById('noteTitle').value = note.title || '';
                document.getElementById('noteContent').value = note.content || '';
                document.getElementById('editorTitle').textContent = note.title || 'Untitled Note';
            }

            createNewNote() {
                if (this.isTranslating || this.isAttachmentBusy) return;
                this.currentNote = {
                    id: null,
                    title: '',
                    content: '',
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                };
                
                this.showEditor();
                document.getElementById('noteTitle').value = '';
                document.getElementById('noteContent').value = '';
                document.getElementById('editorTitle').textContent = 'New Note';
                document.getElementById('noteTitle').focus();
                
                // Remove active state from all notes
                document.querySelectorAll('.note-item').forEach(item => {
                    item.classList.remove('active');
                });
            }

            updateDeleteButtonVisibility() {
                const deleteBtn = document.getElementById('deleteBtn');
                const hasBeenSaved = this.currentNote && this.currentNote.id;
                deleteBtn.style.display = hasBeenSaved ? 'inline-block' : 'none';
                this.renderImages();
            }

            showEditor() {
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('editorForm').style.display = 'flex';
                document.getElementById('editorActions').style.display = 'flex';
                this.updateDeleteButtonVisibility();
            }

            hideEditor() {
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('editorForm').style.display = 'none';
                document.getElementById('editorActions').style.display = 'none';
                document.getElementById('editorTitle').textContent = 'Select a note to edit';
                this.currentNote = null;
                this.updateDeleteButtonVisibility();
            }

            async saveNote(isAutoSave = false) {
                if (!this.currentNote || this.isTranslating || this.isSaving) return;
                if (this.isAttachmentBusy) {
                    if (isAutoSave) this.saveTimeout = setTimeout(() => this.saveNote(true), 1000);
                    return;
                }

                const title = document.getElementById('noteTitle').value.trim();
                const content = document.getElementById('noteContent').value.trim();

                if (!title && !content) {
                    if (!isAutoSave) {
                        this.showMessage('Please enter a title or content', 'error');
                    }
                    return;
                }

                this.isSaving = true;
                try {
                    const noteData = {
                        title: title || 'Untitled',
                        content: content
                    };

                    let response;
                    if (this.currentNote.id) {
                        // Update existing note
                        response = await fetch(`/api/notes/${this.currentNote.id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(noteData)
                        });
                    } else {
                        // Create new note
                        response = await fetch('/api/notes', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(noteData)
                        });
                    }

                    if (!response.ok) throw new Error('Failed to save note');

                    const savedNote = await response.json();
                    this.currentNote = savedNote;
                    
                    // Update notes list
                    const existingIndex = this.notes.findIndex(n => n.id === savedNote.id);
                    if (existingIndex >= 0) {
                        this.notes[existingIndex] = savedNote;
                    } else {
                        this.notes.unshift(savedNote);
                    }
                    
                    this.renderNotesList();
                    document.getElementById('editorTitle').textContent = savedNote.title;
                    this.updateDeleteButtonVisibility();
                    
                    if (!isAutoSave) {
                        this.showMessage('Note saved successfully!', 'success');
                    }
                } catch (error) {
                    this.showMessage(`Error saving note: ${error.message}`, 'error');
                } finally {
                    this.isSaving = false;
                }
            }

            async translateNote() {
                if (!this.currentNote || this.isTranslating || this.isAttachmentBusy) return;
                if (this.isSaving || this.isDeleting) {
                    this.showMessage('Please wait for the current note operation to finish.', 'loading');
                    return;
                }
                const title = document.getElementById('noteTitle').value;
                const content = document.getElementById('noteContent').value;
                if (!title.trim() && !content.trim()) {
                    this.showMessage('Please enter a title or content to translate.', 'error');
                    return;
                }
                clearTimeout(this.saveTimeout);
                this.isTranslating = true;
                const controls = ['translateBtn', 'targetLanguage', 'saveBtn', 'deleteBtn',
                                  'newNoteBtn', 'noteTitle', 'noteContent', 'imageUpload'];
                controls.forEach(id => document.getElementById(id).disabled = true);
                document.getElementById('translateBtn').textContent = 'Translating…';
                this.renderImages();
                this.showMessage('Translating your note…', 'loading');
                try {
                    const response = await fetch('/api/notes/translate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({title, content,
                            target_language: document.getElementById('targetLanguage').value})
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error || 'Translation failed');
                    if (typeof result.title !== 'string' || typeof result.content !== 'string') {
                        throw new Error('Invalid translation response');
                    }
                    document.getElementById('noteTitle').value = result.title;
                    document.getElementById('noteContent').value = result.content;
                    document.getElementById('editorTitle').textContent = result.title || 'Untitled Note';
                    this.showMessage('Translation ready. Click Save to keep it.', 'success');
                } catch (error) {
                    this.showMessage(`Error translating note: ${error.message}`, 'error');
                } finally {
                    this.isTranslating = false;
                    controls.forEach(id => document.getElementById(id).disabled = false);
                    document.getElementById('translateBtn').textContent = 'Translate';
                    this.renderImages();
                }
            }

            async deleteNote() {
                if (this.isTranslating || this.isAttachmentBusy) return;
                if (!this.currentNote || !this.currentNote.id) return;

                if (!confirm('Are you sure you want to delete this note?')) return;

                this.isDeleting = true;
                try {
                    const response = await fetch(`/api/notes/${this.currentNote.id}`, {
                        method: 'DELETE'
                    });

                    if (!response.ok) throw new Error('Failed to delete note');

                    // Remove from notes array
                    this.notes = this.notes.filter(n => n.id !== this.currentNote.id);
                    this.renderNotesList();
                    this.hideEditor();
                    this.showMessage('Note deleted successfully!', 'success');
                } catch (error) {
                    this.showMessage(`Error deleting note: ${error.message}`, 'error');
                } finally {
                    this.isDeleting = false;
                }
            }

            renderImages() {
                const saved = Boolean(this.currentNote && this.currentNote.id);
                document.getElementById('imageUpload').disabled = !saved || this.isAttachmentBusy || this.isTranslating;
                document.getElementById('imageHint').textContent = saved
                    ? 'PNG, JPEG, GIF, WebP or HEIC/HEIF · Up to 5 MB per image'
                    : 'Save this note before attaching images.';
                const gallery = document.getElementById('imageGallery');
                gallery.innerHTML = '';
                for (const image of (this.currentNote?.images || [])) {
                    const card = document.createElement('div');
                    card.className = 'image-card';
                    const link = document.createElement('a');
                    link.href = `/api/notes/${this.currentNote.id}/images/${image.id}`;
                    link.target = '_blank';
                    link.rel = 'noopener';
                    const preview = document.createElement('img');
                    preview.src = link.href;
                    preview.alt = image.filename;
                    preview.loading = 'lazy';
                    link.appendChild(preview);
                    const caption = document.createElement('div');
                    caption.className = 'image-caption';
                    const name = document.createElement('span');
                    name.textContent = image.filename;
                    name.title = image.filename;
                    const remove = document.createElement('button');
                    remove.textContent = 'Remove image';
                    remove.disabled = this.isAttachmentBusy || this.isTranslating;
                    remove.addEventListener('click', () => this.removeImage(image.id));
                    caption.append(name, remove);
                    card.append(link, caption);
                    gallery.appendChild(card);
                }
            }

            setAttachmentBusy(busy) {
                this.isAttachmentBusy = busy;
                for (const id of ['newNoteBtn', 'saveBtn', 'deleteBtn', 'translateBtn',
                                  'targetLanguage', 'noteTitle', 'noteContent']) {
                    document.getElementById(id).disabled = busy;
                }
                this.renderImages();
            }

            async uploadImage() {
                const input = document.getElementById('imageUpload');
                const file = input.files[0];
                if (!file || !this.currentNote?.id) return;
                if (this.isSaving || this.isDeleting || this.isTranslating || this.isAttachmentBusy) {
                    input.value = '';
                    this.showMessage('Please wait for the current operation to finish.', 'loading');
                    return;
                }
                if (file.size > 5 * 1024 * 1024) {
                    input.value = '';
                    this.showMessage('Maximum image size is 5 MB.', 'error');
                    return;
                }
                this.setAttachmentBusy(true);
                this.showMessage('Uploading image…', 'loading');
                try {
                    const body = new FormData();
                    body.append('image', file);
                    const response = await fetch(`/api/notes/${this.currentNote.id}/images`, {method: 'POST', body});
                    const image = await response.json();
                    if (!response.ok) throw new Error(image.error || 'Image upload failed');
                    this.currentNote.images = [...(this.currentNote.images || []), image];
                    this.showMessage('Image attached successfully.', 'success');
                } catch (error) {
                    this.showMessage(error.message, 'error');
                } finally {
                    input.value = '';
                    this.setAttachmentBusy(false);
                }
            }

            async removeImage(imageId) {
                if (!this.currentNote?.id || this.isAttachmentBusy || this.isTranslating || this.isSaving || this.isDeleting) return;
                if (!confirm('Remove this image from the note?')) return;
                this.setAttachmentBusy(true);
                try {
                    const response = await fetch(`/api/notes/${this.currentNote.id}/images/${imageId}`, {method: 'DELETE'});
                    if (!response.ok) {
                        const result = await response.json();
                        throw new Error(result.error || 'Could not remove image');
                    }
                    this.currentNote.images = (this.currentNote.images || []).filter(image => image.id !== imageId);
                    this.showMessage('Image removed.', 'success');
                } catch (error) {
                    this.showMessage(error.message, 'error');
                } finally {
                    this.setAttachmentBusy(false);
                }
            }

            searchNotes(query) {
                const filteredNotes = query.trim() === '' ? this.notes : 
                    this.notes.filter(note => 
                        (note.title && note.title.toLowerCase().includes(query.toLowerCase())) ||
                        (note.content && note.content.toLowerCase().includes(query.toLowerCase()))
                    );

                const notesList = document.getElementById('notesList');
                if (filteredNotes.length === 0) {
                    notesList.innerHTML = '<div class="empty-state"><p>No notes found matching your search.</p></div>';
                    return;
                }

                notesList.innerHTML = filteredNotes.map(note => `
                    <div class="note-item ${this.currentNote && this.currentNote.id === note.id ? 'active' : ''}" 
                         data-note-id="${note.id}" onclick="noteTaker.selectNote(${note.id})">
                        <div class="note-title">${this.escapeHtml(note.title || 'Untitled')}</div>
                        <div class="note-preview">${this.escapeHtml(note.content || 'No content')}</div>
                        <div class="note-date">${this.formatDate(note.updated_at)}</div>
                    </div>
                `).join('');
            }

            showMessage(message, type) {
                const messageArea = document.getElementById('messageArea');
                messageArea.innerHTML = `<div class="${type}">${this.escapeHtml(message)}</div>`;
                
                if (type === 'success') {
                    setTimeout(() => this.hideMessage(), 3000);
                }
            }

            hideMessage() {
                document.getElementById('messageArea').innerHTML = '';
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            formatDate(dateString) {
                const date = new Date(dateString);
                const now = new Date();
                const diffTime = Math.abs(now - date);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays === 1) {
                    return 'Today';
                } else if (diffDays === 2) {
                    return 'Yesterday';
                } else if (diffDays <= 7) {
                    return `${diffDays - 1} days ago`;
                } else {
                    return date.toLocaleDateString();
                }
            }
        }

        // Initialize the app
        const noteTaker = new NoteTaker();
    </script>
</body>
</html>
